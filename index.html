<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 خمّن الشخصية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #e94560, #903749);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #aaa; margin-bottom: 30px; font-size: 0.95rem; line-height: 1.6; }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 14px 24px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #e94560, #903749);
    color: #fff;
    width: 100%;
    margin-top: 15px;
  }
  .btn-primary:hover { box-shadow: 0 8px 20px rgba(233,69,96,0.4); }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); }
  .btn-group { display: flex; gap: 10px; margin-top: 15px; }
  .btn-group button { flex: 1; margin-top: 0; }
  .question-text {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 20px 0 30px;
    line-height: 1.5;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  input[type="text"] {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    margin-top: 8px;
    margin-bottom: 16px;
    text-align: right;
  }
  input[type="text"]:focus { outline: none; border-color: #e94560; }
  label { display: block; text-align: right; font-size: 0.9rem; color: #ccc; }
  .radio-group { display: flex; gap: 10px; margin-bottom: 16px; }
  .radio-group label {
    flex: 1;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    color: #fff;
  }
  .radio-group input { display: none; }
  .radio-group label:has(input:checked) {
    background: linear-gradient(135deg, #e94560, #903749);
    border-color: #e94560;
  }
  .badge {
    display: inline-block;
    background: rgba(233,69,96,0.2);
    color: #e94560;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .screen { display: none; animation: fadeIn 0.4s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .footer { margin-top: 30px; font-size: 0.8rem; color: #666; }
  .footer button {
    background: none;
    color: #888;
    padding: 5px 10px;
    font-size: 0.8rem;
    text-decoration: underline;
  }
  .footer button:hover { color: #e94560; }
</style>
</head>
<body>
<div class="container">

  <!-- شاشة البداية -->
  <div id="screen-start" class="screen active">
    <h1>🎭 خمّن الشخصية</h1>
    <p class="subtitle">فكّر في شخصية مشهورة (حقيقية أو خيالية)، وسأحاول تخمينها بأسئلة نعم/لا.</p>
    <div class="badge" id="stats">الشخصيات المعروفة: 0</div>
    <button class="btn-primary" onclick="startGame()">ابدأ اللعب ▶</button>
  </div>

  <!-- شاشة السؤال -->
  <div id="screen-question" class="screen">
    <div class="badge">سؤال رقم <span id="qnum">1</span></div>
    <div class="question-text" id="question-text">—</div>
    <div class="btn-group">
      <button class="btn-primary" onclick="answer('yes')">نعم ✅</button>
      <button class="btn-primary" style="background: linear-gradient(135deg,#555,#333)" onclick="answer('no')">لا ❌</button>
    </div>
  </div>

  <!-- شاشة التخمين -->
  <div id="screen-guess" class="screen">
    <div class="badge">تخميني 🤔</div>
    <div class="question-text">هل شخصيتك هي:<br><strong id="guess-name">—</strong>؟</div>
    <div class="btn-group">
      <button class="btn-primary" onclick="correctGuess()">نعم، صحيح! 🎉</button>
      <button class="btn-primary" style="background: linear-gradient(135deg,#555,#333)" onclick="wrongGuess()">لا، ليس هو ❌</button>
    </div>
  </div>

  <!-- شاشة التعلم -->
  <div id="screen-learn" class="screen">
    <div class="badge">ساعدني أتعلم 🧠</div>
    <div class="question-text" style="font-size:1.1rem; min-height:auto; margin-bottom:20px;">
      آسف، لم أعرف شخصيتك. أخبرني من هي لأتعلمها:
    </div>
    <label for="new-name">اسم الشخصية:</label>
    <input type="text" id="new-name" placeholder="مثال: نيلسون مانديلا" autocomplete="off">
    <label for="new-q">سؤال يميّزها عن "<span id="old-guess"></span>":</label>
    <input type="text" id="new-q" placeholder="مثال: هل هو سياسي؟" autocomplete="off">
    <label>بالنسبة لهذه الشخصية، الإجابة على السؤال هي:</label>
    <div class="radio-group">
      <label><input type="radio" name="answer-new" value="yes" checked> نعم</label>
      <label><input type="radio" name="answer-new" value="no"> لا</label>
    </div>
    <button class="btn-primary" onclick="saveLearning()">حفظ ومتابعة 💾</button>
  </div>

  <!-- شاشة النهاية -->
  <div id="screen-end" class="screen">
    <h1 id="end-title">🎉</h1>
    <div class="question-text" id="end-text" style="font-size:1.1rem"></div>
    <button class="btn-primary" onclick="startGame()">العب مرة أخرى 🔄</button>
    <button class="btn-secondary" style="width:100%; margin-top:10px" onclick="showScreen('start')">القائمة الرئيسية</button>
  </div>

  <div class="footer">
    <button onclick="resetTree()">إعادة تعيين ذاكرة اللعبة</button>
  </div>
</div>

<script>
// ===== الشجرة الافتراضية =====
const defaultTree = {
  type: "question",
  text: "هل الشخصية حقيقية (موجودة في الواقع)؟",
  yes: {
    type: "question",
    text: "هل الشخصية عربية؟",
    yes: {
      type: "question",
      text: "هل هي رجل؟",
      yes: {
        type: "question",
        text: "هل هو رياضي؟",
        yes: { type: "character", name: "محمد صلاح" },
        no: {
          type: "question",
          text: "هل هو كاتب؟",
          yes: { type: "character", name: "نجيب محفوظ" },
          no: { type: "character", name: "عادل إمام" }
        }
      },
      no: {
        type: "question",
        text: "هل هي فنانة (مغنية أو ممثلة)؟",
        yes: { type: "character", name: "فيروز" },
        no: { type: "character", name: "توكل كرمان" }
      }
    },
    no: {
      type: "question",
      text: "هل هي رجل؟",
      yes: {
        type: "question",
        text: "هل هو رياضي؟",
        yes: { type: "character", name: "ليونيل ميسي" },
        no: {
          type: "question",
          text: "هل هو رجل أعمال أو تقني؟",
          yes: { type: "character", name: "إيلون ماسك" },
          no: { type: "character", name: "ألبرت أينشتاين" }
        }
      },
      no: {
        type: "question",
        text: "هل هي ممثلة؟",
        yes: { type: "character", name: "أنجلينا جولي" },
        no: { type: "character", name: "ماريا كاري" }
      }
    }
  },
  no: {
    type: "question",
    text: "هل هي شخصية كرتونية أو أنمي؟",
    yes: {
      type: "question",
      text: "هل هي من أفلام ديزني أو بيكسار؟",
      yes: { type: "character", name: "ميكي ماوس" },
      no: {
        type: "question",
        text: "هل هي من الأنمي الياباني؟",
        yes: { type: "character", name: "ناروتو" },
        no: { type: "character", name: "سبونج بوب" }
      }
    },
    no: {
      type: "question",
      text: "هل هي بطل خارق؟",
      yes: {
        type: "question",
        text: "هل يطير؟",
        yes: { type: "character", name: "سوبرمان" },
        no: { type: "character", name: "باتمان" }
      },
      no: {
        type: "question",
        text: "هل هي شخصية ساحرة أو خارقة؟",
        yes: { type: "character", name: "هاري بوتر" },
        no: { type: "character", name: "دارث فيدر" }
      }
    }
  }
};

// ===== الحالة العامة =====
let tree = null;
let currentNode = null;
let nodePath = [];
let questionCount = 0;

// ===== أدوات التنقل بين الشاشات =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ===== إدارة الشجرة والتخزين =====
function loadTree() {
  const saved = localStorage.getItem('characterGuesserTree');
  if (saved) {
    try { tree = JSON.parse(saved); return; } catch (e) {}
  }
  tree = JSON.parse(JSON.stringify(defaultTree));
}

function saveTree() {
  localStorage.setItem('characterGuesserTree', JSON.stringify(tree));
}

function resetTree() {
  if (!confirm('هل تريد حذف كل التعلّمات والعودة للشخصيات الافتراضية؟')) return;
  localStorage.removeItem('characterGuesserTree');
  tree = JSON.parse(JSON.stringify(defaultTree));
  updateStats();
  showScreen('start');
}

function countCharacters(node) {
  if (!node) return 0;
  if (node.type === 'character') return 1;
  return countCharacters(node.yes) + countCharacters(node.no);
}

function updateStats() {
  document.getElementById('stats').textContent = 'الشخصيات المعروفة: ' + countCharacters(tree);
}

// ===== منطق اللعبة =====
function startGame() {
  loadTree();
  updateStats();
  currentNode = tree;
  nodePath = [{ node: tree, parent: null, branch: null }];
  questionCount = 0;
  nextStep();
}

function nextStep() {
  if (currentNode.type === 'character') {
    document.getElementById('guess-name').textContent = currentNode.name;
    showScreen('guess');
  } else {
    questionCount++;
    document.getElementById('qnum').textContent = questionCount;
    document.getElementById('question-text').textContent = currentNode.text;
    showScreen('question');
  }
}

function answer(ans) {
  const child = ans === 'yes' ? currentNode.yes : currentNode.no;
  if (!child) {
    alert('حدث خطأ في الشجرة، سيتم إعادة التعيين.');
    resetTree();
    return;
  }
  nodePath.push({ node: child, parent: currentNode, branch: ans });
  currentNode = child;
  nextStep();
}

function correctGuess() {
  document.getElementById('end-title').textContent = '🎉';
  document.getElementById('end-text').innerHTML =
    'رائع! خمّنت <strong>' + currentNode.name + '</strong> في ' + questionCount + ' سؤال.';
  updateStats();
  showScreen('end');
}

function wrongGuess() {
  document.getElementById('old-guess').textContent = currentNode.name;
  document.getElementById('new-name').value = '';
  document.getElementById('new-q').value = '';
  showScreen('learn');
}

function saveLearning() {
  const newName = document.getElementById('new-name').value.trim();
  const newQ = document.getElementById('new-q').value.trim();
  const answerNew = document.querySelector('input[name="answer-new"]:checked').value;

  if (!newName || !newQ) {
    alert('الرجاء إدخال اسم الشخصية والسؤال المميز.');
    return;
  }

  const oldName = currentNode.name;
  const lastEntry = nodePath[nodePath.length - 1];
  const parentNode = lastEntry.parent;
  const branch = lastEntry.branch;

  const newNode = {
    type: 'question',
    text: newQ,
    yes: answerNew === 'yes'
      ? { type: 'character', name: newName }
      : { type: 'character', name: oldName },
    no: answerNew === 'yes'
      ? { type: 'character', name: oldName }
      : { type: 'character', name: newName }
  };

  if (parentNode === null) {
    tree = newNode;
  } else if (branch === 'yes') {
    parentNode.yes = newNode;
  } else {
    parentNode.no = newNode;
  }

  saveTree();
  updateStats();

  document.getElementById('end-title').textContent = '🧠';
  document.getElementById('end-text').innerHTML =
    'شكرًا! تعلمت شخصية جديدة: <strong>' + newName + '</strong>.<br>الآن أعرف ' + countCharacters(tree) + ' شخصية.';
  showScreen('end');
}

// ===== التهيئة =====
loadTree();
updateStats();
</script>
</body>
</html>
